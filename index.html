<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Coffee Deck</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav>

<div class="logo">

The Coffee Deck

</div>

<div id="count">

0 Cards

</div>

</nav>

<header class="hero">

<h1>

Learn Coffee.<br>
One Card at a Time.

</h1>

<p>

A modern learning system for coffee professionals.

</p>

<div class="search-wrapper">

<input
id="search"
placeholder="Search cards...">

</div>

<div id="filters"></div>

</header>

<section id="dashboard">

<div class="stat">

<h2>Total Cards</h2>

<span id="totalCards">0</span>

</div>

<div class="stat">

<h2>Bookmarks</h2>

<span id="bookmarkCount">0</span>

<button id="exportBookmarks" class="export-link">
Export
</button>

</div>

<div class="stat">

<h2>Recently Viewed</h2>

<span id="recentCount">0</span>

</div>

<div class="stat" id="dueStat">

<h2>Due Today</h2>

<span id="dueCount">0</span>

</div>

<div class="stat" id="masteredStat">

<h2>Mastered</h2>

<span id="masteredCount">0</span>

</div>

</section>

<main id="cards"></main>

<script type="module" src="./src/app.js"></script>

</body>
</html>
