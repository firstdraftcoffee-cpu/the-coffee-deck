<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Coffee Deck</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav>

<div class="logo">

The Coffee Deck

</div>

<div class="nav-actions">

<button id="filterToggle" class="icon-button" aria-label="Search and filter">

<span class="icon-glyph">⌕</span> <span class="icon-label">Search</span>

</button>

<button id="studyToggle" class="icon-button" aria-label="Study mode">

<span class="icon-glyph">▸︎</span> <span class="icon-label">Study</span>

</button>

<button id="statsToggle" class="icon-button" aria-label="Your progress">

<span class="icon-glyph">◔</span> <span class="icon-label">Progress</span>

</button>

<div id="count">

0 Cards

</div>

<div id="langSwitch" class="lang-switch"></div>

</div>

</nav>

<div id="filterPanel" class="filter-panel">

<div class="filter-panel-inner">

<div class="search-wrapper">

<input
id="search"
placeholder="Search cards...">

</div>

<div id="filters"></div>

</div>

</div>

<main id="home"></main>

<script type="module" src="./src/app.js"></script>

</html>
