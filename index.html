<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Coffee Deck [DEPLOY-CHECK-7429]</title>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#E8663D">

<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coffee Deck">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

<script>
(function() {
    try {
        var stored = localStorage.getItem("coffeeDeck:theme");
        var theme = stored ? JSON.parse(stored) : null;
        if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
    }
})();
</script>

</head>

<body>

<nav>

<button id="homeButton" class="logo" aria-label="Go to home">

The Coffee Deck

</button>

<div class="nav-actions">

<button id="filterToggle" class="icon-button" aria-label="Search and filter">

<span class="icon-glyph">⌕</span> <span class="icon-label">Search</span>

</button>

<button id="studyToggle" class="icon-button" aria-label="Study mode">

<span class="icon-glyph">▸︎</span> <span class="icon-label">Study</span>

</button>

<button id="statsToggle" class="icon-button" aria-label="Your progress">

<span class="icon-glyph">◔</span> <span class="icon-label">Progress</span>

</button>

<button id="subscribeToggle" class="subscribe-button" aria-label="Subscribe" hidden>

Subscribe

</button>

<div id="count">

0 Cards

</div>

<div id="langSwitch" class="lang-switch"></div>

<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">

<span class="theme-toggle-icon">☀</span>

</button>

</div>

</nav>

<div id="filterPanel" class="filter-panel">

<div class="filter-panel-inner">

<div class="search-wrapper">

<input
type="text"
id="search"
autocomplete="off"
placeholder="Search the deck...">

</div>

<div id="filters"></div>

</div>

</div>

<main id="home"></main>

<script type="module" src="./src/app.js"></script>

</body>
</html>
