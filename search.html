<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Search — The Coffee Deck</title>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#E8663D">

<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coffee Deck">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="search.css">

<script>
(function() {
    try {
        var stored = localStorage.getItem("coffeeDeck:theme");
        var theme = stored ? JSON.parse(stored) : null;
        if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
    } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
    }
})();
</script>

</head>

<body>

<nav>

<a href="index.html" id="homeButton" class="logo">The Coffee Deck</a>

<div class="nav-actions">

<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">

<span class="theme-toggle-icon">☀</span>

</button>

</div>

</nav>

<main id="searchPage">

<div class="search-page-inner">

<form id="searchForm" role="search" autocomplete="off">

<input
type="text"
id="search"
name="q"
autocomplete="off"
placeholder="Search the deck...">

</form>

<div id="categoryList" class="category-list"></div>

<div id="resultCount" class="result-count"></div>

<div id="results" class="results-list"></div>

</div>

</main>

<script type="module" src="./src/search.js"></script>

</body>
</html>
